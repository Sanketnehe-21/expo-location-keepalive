<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0b112c" />
      <stop offset="100%" stop-color="#080718" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#E100FF" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7f00ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="radar-pulse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7F00FF" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />

  <!-- Ambient Light Blobs -->
  <circle cx="150" cy="120" r="220" fill="#00F2FE" opacity="0.08" filter="url(#glow-soft)" />
  <circle cx="1050" cy="520" r="260" fill="#E100FF" opacity="0.09" filter="url(#glow-soft)" />
  <circle cx="850" cy="180" r="180" fill="#4FACFE" opacity="0.06" filter="url(#glow-soft)" />

  <!-- Subtle Tech Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Top Badge: Open Source Release -->
  <g transform="translate(80, 68)">
    <rect width="248" height="36" rx="18" fill="#141B3B" stroke="url(#cyan-violet)" stroke-width="1.2" />
    <circle cx="20" cy="18" r="5" fill="#00F2FE" filter="url(#glow-cyan)" />
    <text x="36" y="23" fill="#A5B4FC" class="font-mono" font-size="13" font-weight="600" letter-spacing="1">OPEN SOURCE RELEASE</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="165" fill="#FFFFFF" class="font-title" font-size="52" letter-spacing="-1">
    expo-location-<tspan fill="url(#cyan-violet)">keepalive</tspan>
  </text>

  <!-- Subheadline -->
  <text x="80" y="214" fill="#94A3B8" class="font-sans" font-size="22">
    Bulletproof background location tracking for <tspan fill="#F8FAFC" font-weight="700">React Native</tspan> &amp; <tspan fill="#F8FAFC" font-weight="700">Expo</tspan>
  </text>

  <!-- Left: Feature Cards Grid -->
  <g transform="translate(80, 260)">
    <!-- Feature 1 -->
    <g transform="translate(0, 0)">
      <rect width="280" height="92" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="url(#card-border)" stroke-width="1.2" />
      <text x="20" y="36" font-size="22">🛡️</text>
      <text x="56" y="34" fill="#F1F5F9" class="font-sans" font-size="16" font-weight="700">Anti-Swipe Guard</text>
      <text x="20" y="66" fill="#94A3B8" class="font-sans" font-size="13">START_STICKY background service</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(300, 0)">
      <rect width="280" height="92" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="url(#card-border)" stroke-width="1.2" />
      <text x="20" y="36" font-size="22">⚡</text>
      <text x="56" y="34" fill="#F1F5F9" class="font-sans" font-size="16" font-weight="700">Native HTTP Engine</text>
      <text x="20" y="66" fill="#94A3B8" class="font-sans" font-size="13">Bypasses headless JS fetch hang</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(0, 110)">
      <rect width="280" height="92" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="url(#card-border)" stroke-width="1.2" />
      <text x="20" y="36" font-size="22">📦</text>
      <text x="56" y="34" fill="#F1F5F9" class="font-sans" font-size="16" font-weight="700">Zero-Loss Offline Queue</text>
      <text x="20" y="66" fill="#94A3B8" class="font-sans" font-size="13">Write-ahead AsyncStorage buffer</text>
    </g>

    <!-- Feature 4 -->
    <g transform="translate(300, 110)">
      <rect width="280" height="92" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="url(#card-border)" stroke-width="1.2" />
      <text x="20" y="36" font-size="22">🔋</text>
      <text x="56" y="34" fill="#F1F5F9" class="font-sans" font-size="16" font-weight="700">OEM Killer Defense</text>
      <text x="20" y="66" fill="#94A3B8" class="font-sans" font-size="13">Xiaomi, Vivo, Oppo, TECNO, Samsung</text>
    </g>
  </g>

  <!-- Right: Radar Visual / Interactive Monitor Graphic -->
  <g transform="translate(730, 180)">
    <!-- Glowing Container Card -->
    <rect width="390" height="380" rx="22" fill="#0A0E23" fill-opacity="0.9" stroke="url(#card-border)" stroke-width="1.5" />

    <!-- Card Header -->
    <circle cx="28" cy="32" r="5" fill="#EF4444" />
    <circle cx="44" cy="32" r="5" fill="#F59E0B" />
    <circle cx="60" cy="32" r="5" fill="#10B981" />
    <text x="84" y="37" fill="#64748B" class="font-mono" font-size="12">keepalive-telemetry.log</text>

    <!-- Concentric Radar Rings -->
    <g transform="translate(195, 175)">
      <circle cx="0" cy="0" r="105" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4" />
      <circle cx="0" cy="0" r="75" fill="none" stroke="#334155" stroke-width="1" />
      <circle cx="0" cy="0" r="45" fill="none" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="1.2" />
      
      <!-- Sweep line -->
      <line x1="0" y1="0" x2="68" y2="-68" stroke="url(#cyan-violet)" stroke-width="2" />
      <polygon points="0,0 70,-45 45,-70" fill="url(#radar-pulse)" />

      <!-- Center Live Signal Pin -->
      <circle cx="0" cy="0" r="12" fill="#00F2FE" fill-opacity="0.2" filter="url(#glow-cyan)" />
      <circle cx="0" cy="0" r="6" fill="#00F2FE" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />

      <!-- Ping Waypoints -->
      <circle cx="-52" cy="-35" r="3.5" fill="#10B981" />
      <circle cx="-25" cy="45" r="3.5" fill="#10B981" />
      <circle cx="55" cy="20" r="3.5" fill="#10B981" />
    </g>

    <!-- Real Device Benchmark Pill Box -->
    <g transform="translate(24, 290)">
      <rect width="342" height="66" rx="12" fill="#030712" stroke="#1E293B" stroke-width="1" />
      
      <text x="18" y="26" fill="#38BDF8" class="font-mono" font-size="12" font-weight="700">BENCHMARK: TECNO HiOS</text>
      <text x="18" y="48" fill="#F8FAFC" class="font-mono" font-size="13">
        0.26s restart <tspan fill="#64748B">|</tspan> <tspan fill="#4ADE80">121/121 pings</tspan> <tspan fill="#64748B">|</tspan> 0 crashes
      </text>
    </g>
  </g>

  <!-- Bottom Bar: Compatibility & Specs -->
  <g transform="translate(80, 595)">
    <!-- Expo SDK Pill -->
    <rect x="0" y="0" width="130" height="32" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="14" y="20" fill="#E2E8F0" class="font-mono" font-size="12">Expo SDK 52-54+</text>

    <!-- Architecture Pill -->
    <rect x="142" y="0" width="145" height="32" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="156" y="20" fill="#E2E8F0" class="font-mono" font-size="12">Expo Modules API</text>

    <!-- License Pill -->
    <rect x="299" y="0" width="105" height="32" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="313" y="20" fill="#E2E8F0" class="font-mono" font-size="12">MIT License</text>

    <!-- GitHub / npm target -->
    <text x="740" y="21" fill="#94A3B8" class="font-mono" font-size="13">
      npm i <tspan fill="#38BDF8" font-weight="700">expo-location-keepalive</tspan>
    </text>
  </g>
</svg>